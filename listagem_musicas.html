<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Musical</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100100%27><text y=%27.9em%27 font-size=%2790%27>🎵</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ========Cabeçalho da página =========
         page-header-bar: O CSS(flex + space-between) deixa o título 
         á esquerda e os botões á direita. Esta barra repete nos cadastros. -->
         <div class="page-header-bar"> 
            <h2>🎼Biblioteca Musical</h2>    <!-- h2: o titulo desta tela -->
            <div class="header-actions">
                <!-- Links com cara de botão:btn-back (escuro) e bnt-primary(azul) -->
                 <a href="index.html" class="btn-back">Voltar ao Menu</a>
                 <a href="cadastro_musica.html" class="btn-primary">➕ Nova Música</a>
         </div>
    </div>

    <!-- =============Filtros===========
     Nesta fase eles só aparecem (não filtram de verdade).
     method="get": na Sprint 2 o que a pessoa escolher vai aparecer no endereço 
     (ex.: ?artista=1) e o PHP usa isso para filtrar no banco. -->
     <div class="filters">
        <form  method="get" class="filter-form" action="#">

            <!-- filter-froup: os 3 filtros. O CSS (flex) coloca lado a lado. -->
            <div class="filter-group">

                <!-- filter-item: um filtro = rótulo + campo -->
                 <div class="filter-item">
                    <label for="busca"> Busca Geral</label>
                    <input type="text" name="busca" id="busca" placeholder="Título, álbum ou artista...">
                 </div>

                 <div class="filter-item">
                    <label for="artista"> Artista</label>
                    <!-- select: lista para escolher uma opção.
                     value="(vazio) = "todos". O númeor é o código do artista no banco -->
                     <select name="artista" id="artista">
                        <option value="">Todos os Artistas </option>
                        <option value="1">Djavan</option>
                        <option value="2">Marisa Monte</option>
                     </select>
                 </div>

                 <div class="filter-item">
                    <label for="genero"> Gênero</label>
                    <select name="genero" id="genero">
                        <option value="">Todos os gêneros</option>
                        <option value="MPB">MPB</option>
                    </select>
                 </div>
            </div>

            <!-- filter-actions: a área do botão de filtrar -->
             <div class="filter-actions">
                <button type="submit" class="bnt-primary">🔍Filtrar</button>
             </div>
        </form>
     </div>
    
     <!-- ==========TABELA DE MÚSICAS============
      table-container: a caixa branca com sombra em volta da tabela. -->
      <div class="table-container"> 
        <table>
            <!-- thead: o cabeçalho da tabela. tr = linha. th = célula destas colunas -->
             <thead>
                <tr>
                    <!-- As classes col-... deixam o CSS controlar a largura destas colunas. -->
                     <th class="col-capa">Capa</th>
                     <th>Título</th>
                     <th>Artistas</th>
                     <th>Album</th>
                     <th>Gênero</th>
                     <th class="col-youtube"> Youtube</th>
                     <th class="col-acoes">Ações</th>
                </tr>
             </thead>
             <!-- tbody:o corpo. Cada tr é uma música;cada td é uma informação dela.
              Os dados estão fixos aqui. Na Sprint 2 o PHP cria estaws linhas a partir do banco.-->
              <tbody>
                <tr>
                    <!-- no-image: quadrado"sem capa" no lugar da imagem ( a capa real vem na Sprint 2). -->
                     <td><div class="no-image"> Sem <br>Capa</div></td>
                     <td>Oceano</td>
                     <td>Djavan</td>
                     <td>Luz</td>
                     <td>MPB</td>
                     <!-- target="_blank": abre o vídeo numa aba nova, sem sair dos sistema. -->
                      <td> <a href="#" target="_blank" class="btn-youtube">▶ Assistir </a></td>

                     <td>
                        <div class="actions-buttons">
                            <a href="#" class="btn-edit"> ✏️Editar</a>
                            <a href="#" class="btn-delete">🗑️</a>

                        </div>
                     </td>
                </tr>
                <tr>
                    <td><div class="no-image">Sem <br> Capa</div></td>
                    <td>Infinito Particular</td>
                    <td>Marisa Monte</td>
                    <td>-</td> <!-- sem álbum:mostramos um traço -->
                    <td>MPB</td>
                    <td><a href="#" target="_blank" class="btn-youtube">▶Assistir</a></td>
                    <td><a href="#" class="btn-edit">✏️Editar</a>
                    <a href="#" class="btn-delete">🗑️</a>
                </td>
                </tr>
              </tbody>
        </table>
      </div>
</body>
</html>
